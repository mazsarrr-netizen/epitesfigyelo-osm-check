name: OSM epitesfigyelo ellenorzes

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Teszt email kuldese (igen/true eseten mindenkepp kuld egy proba levelet)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Overpass-ellenorzes futtatasa
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_ADDRESS: ${{ secrets.FROM_ADDRESS }}
          TO_ADDRESS: ${{ secrets.TO_ADDRESS }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python check_osm.py

      - name: Eredmenyfajlok visszairasa, ha valtoztak
        run: |
          git config user.name "epitesfigyelo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen-ids.json latest-elements.json
          git diff --cached --quiet || git commit -m "OSM ellenorzes eredmenyeinek frissitese"
          git push
